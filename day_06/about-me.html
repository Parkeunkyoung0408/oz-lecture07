<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>박은경</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>박은경</h1>
      <nav class="nav">
        <a class="logo" href="#intro">박은경</a>
        <ul class="menu">
          <li><a href="#intro">소개</a></li>
          <li><a href="#work">작업</a></li>
          <li><a href="#contact">연락처</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="intro">
        <img src="profile-cutout.png" alt="박은경의 프로필 사진">
        <div class="intro-copy">
          <h2>소개</h2>
          <p class="lead">명확하고 직관적인 디지털 경험을 만드는 디자이너 박은경입니다. 웹사이트와 디지털 제품을 디자인하며, 시각적 완성도와 사용성을 함께 고려합니다.</p>
        </div>
      </section>

      <section id="work">
        <h2>작업</h2>

        <div class="cards">
          <article class="card">
            <h3>자기소개</h3>
            <p>디자인에 대한 관심과 나의 강점을 소개합니다.</p>
          </article>

          <article class="card">
            <h3><a href="https://eunkyoung.framer.website/" target="_blank" rel="noopener noreferrer">포트폴리오</a></h3>
            <p>직접 제작한 디자인 작업을 모았습니다.</p>
          </article>

          <article class="card">
            <h3>역량</h3>
            <p>
              <strong>UX/UI</strong> · 웹 및 앱 인터페이스 디자인<br>
              <strong>브랜딩</strong> · 브랜드의 시각적 아이덴티티 디자인<br>
              <strong>Blender</strong> · 3D 캐릭터 제작
            </p>
          </article>
        </div>
      </section>

      <section id="contact">
        <h2>연락처</h2>
        <p class="contact-phone">전화: 010-4249-****</p>

        <form action="/contact" method="post">
          <fieldset>
            <legend>문의 남기기</legend>

            <label for="name">이름</label>
            <input type="text" id="name" name="name" required>

            <label for="message">내용</label>
            <textarea id="message" name="message" rows="4"></textarea>

            <button type="submit">보내기</button>
          </fieldset>
        </form>
      </section>
    </main>

    <footer>
      <p>2026 박은경</p>
    </footer>
  </body>
</html>
